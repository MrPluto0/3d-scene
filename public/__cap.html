<!doctype html>
<!-- temporary capture wrapper: drives the viewer camera via window.__three with UI hidden; deleted after use -->
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#06080f;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
<iframe src="/stall/viewer.html"></iframe>
<script>
  const VIEWS = {
    street:   { pos: [-4.7, 0.7, 2.9],  tgt: [0.8, 1.4, -4.4] },
    table:    { pos: [2.3, 0.95, -1.3], tgt: [0.3, 1.5, -4.0] },
    shoulder: { pos: [1.75, 1.5, -1.95],tgt: [0.35, 1.35, -4.5] },
  };
  const v = new URLSearchParams(location.search).get('v') || 'street';
  const f = document.querySelector('iframe');
  f.addEventListener('load', () => {
    const d = f.contentDocument, w = f.contentWindow;
    const st = d.createElement('style');
    st.textContent = '#title,#hint,#bar,#load{display:none!important}';
    d.head.appendChild(st);
    let n = 0;
    (function apply() {
      if (w.__three && w.__three.camera) {
        const view = VIEWS[v];
        w.__three.controls.autoRotate = false;
        w.__three.camera.position.set(...view.pos);
        w.__three.controls.target.set(...view.tgt);
        w.__three.controls.update();
        document.body.setAttribute('data-debug', 'set ' + v);
      } else if (n++ < 100) {
        setTimeout(apply, 100);
      } else {
        document.body.setAttribute('data-debug', 'no __three');
      }
    })();
  });
</script>
